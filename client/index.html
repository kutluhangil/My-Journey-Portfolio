    <!-- Elfsight LinkedIn Feed — loaded when the browser is idle to keep it off the critical path -->
    <script>
      (function () {
        function loadElfsight() {
          if (document.getElementById("elfsight-platform")) return;
          var s = document.createElement("script");
          s.id = "elfsight-platform";
          s.src = "https://elfsightcdn.com/platform.js";
          s.async = true;
          document.body.appendChild(s);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadElfsight, { timeout: 5000 });
        } else {
          window.addEventListener("load", function () { setTimeout(loadElfsight, 2000); });
        }
      })();
    </script>
